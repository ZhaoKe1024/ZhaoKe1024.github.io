{% include base_path %}

<section class="page__share">
  <h4 class="page__share-title">Share / Find me</h4>

  {% if site.author.twitter %}
  <a href="https://x.com/intent/post?text={{ page.title | url_encode }}&amp;url={{ page.url | absolute_url | url_encode }}"
     class="btn btn--x" title="Share on X"><i class="fab fa-x-twitter" aria-hidden="true"></i><span> X</span></a>
  {% endif %}

  {% if site.author.github %}
  <a href="https://github.com/{{ site.author.github }}" class="btn btn--github" title="GitHub">
    <i class="fab fa-github" aria-hidden="true"></i><span> GitHub</span></a>
  {% endif %}

  {% if site.author.huggingface %}
  <a href="{{ site.author.huggingface }}" class="btn btn--huggingface" title="Hugging Face">
    <i class="fas fa-face-smile" aria-hidden="true"></i><span> Hugging Face</span></a>
  {% endif %}

  {% if site.author.cnblogs %}
  <a href="{{ site.author.cnblogs }}" class="btn btn--cnblogs" title="博客园">
    <i class="fas fa-blog" aria-hidden="true"></i><span> 博客园</span></a>
  {% endif %}

  {% if site.author.zhihu %}
  <a href="https://www.zhihu.com/people/{{ site.author.zhihu }}" class="btn btn--zhihu" title="Zhihu">
    <i class="fab fa-zhihu" aria-hidden="true"></i><span> Zhihu</span></a>
  {% endif %}
</section>
